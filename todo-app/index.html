<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Todo App | Task Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <i class="fas fa-tasks"></i>
                <h1>TaskFlow Pro</h1>
                <p class="subtitle">Smart task management</p>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Total Tasks</span>
                    <span id="total-tasks" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Completed</span>
                    <span id="completed-tasks" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Pending</span>
                    <span id="pending-tasks" class="stat-value">0</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="app-main">
            <!-- Controls -->
            <div class="controls">
                <div class="search-container">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-input" placeholder="Search tasks..." autocomplete="off">
                </div>
                <div class="filter-controls">
                    <select id="filter-select">
                        <option value="all">All Tasks</option>
                        <option value="pending">Pending</option>
                        <option value="completed">Completed</option>
                        <option value="today">Today</option>
                        <option value="overdue">Overdue</option>
                    </select>
                    <select id="sort-select">
                        <option value="date-desc">Newest First</option>
                        <option value="date-asc">Oldest First</option>
                        <option value="priority">Priority</option>
                        <option value="title">Alphabetical</option>
                    </select>
                </div>
                <button id="add-task-btn" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Add Task
                </button>
            </div>

            <!-- Tasks Container -->
            <div class="tasks-container">
                <div id="tasks-list">
                    <!-- Tasks will be loaded here -->
                </div>
                <div class="empty-state" id="empty-state">
                    <i class="fas fa-clipboard-list"></i>
                    <h3>No tasks yet</h3>
                    <p>Add your first task to get started!</p>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="quick-actions">
                <button id="clear-completed" class="btn btn-secondary">
                    <i class="fas fa-check-double"></i> Clear Completed
                </button>
                <button id="export-tasks" class="btn btn-secondary">
                    <i class="fas fa-download"></i> Export
                </button>
                <button id="import-tasks" class="btn btn-secondary">
                    <i class="fas fa-upload"></i> Import
                </button>
            </div>
        </main>

        <!-- Task Modal -->
        <div class="modal" id="task-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modal-title">Add New Task</h2>
                    <button id="close-modal" class="close-btn">&times;</button>
                </div>
                <form id="task-form">
                    <div class="form-group">
                        <label for="task-title">Title *</label>
                        <input type="text" id="task-title" required autocomplete="off">
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="task-date">Due Date</label>
                            <input type="date" id="task-date">
                        </div>
                        <div class="form-group">
                            <label for="task-priority">Priority</label>
                            <select id="task-priority">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="task-description">Description</label>
                        <textarea id="task-description" rows="4" placeholder="Add details..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="task-category">Category</label>
                        <select id="task-category">
                            <option value="personal">Personal</option>
                            <option value="work">Work</option>
                            <option value="shopping">Shopping</option>
                            <option value="health">Health</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="task-reminder">
                        <label for="task-reminder">Set reminder</label>
                    </div>
                    
                    <div class="modal-footer">
                        <button type="button" id="cancel-btn" class="btn btn-secondary">Cancel</button>
                        <button type="submit" id="save-task-btn" class="btn btn-primary">Save Task</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Notification -->
        <div class="notification" id="notification">
            <div class="notification-content">
                <i class="fas fa-check-circle"></i>
                <span id="notification-text">Task saved successfully!</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
